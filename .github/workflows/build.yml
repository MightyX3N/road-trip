# Builds the Road Trip APK on GitHub's servers. Runs on every push to main, or by hand
# from the Actions tab ("Run workflow"). The APK is attached to the run as "road-trip-apk".
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # love-android commit Road Trip was written against (LÖVE 12, SDL3)
      LOVE_ANDROID_COMMIT: 1c89bb0b2e35ac497e6b8f3f159c73df32cd5cb4

    steps:
      - name: Get Road Trip
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Get love-android
        run: |
          git clone https://github.com/love2d/love-android love-android
          cd love-android
          git checkout "$LOVE_ANDROID_COMMIT"
          git submodule update --init --recursive --depth 1

      - name: Add Road Trip to it
        run: |
          rsync -a --exclude debug.keystore android/ love-android/
          mkdir -p love-android/app/src/embed/assets
          cp -r game/. love-android/app/src/embed/assets/
          # same signing key every build, so a new APK installs over the old one
          mkdir -p ~/.android
          cp android/debug.keystore ~/.android/debug.keystore

      # Gradle downloads the exact SDK platform and NDK love-android asks for by itself,
      # as long as the licenses are accepted.
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          grep -E "ndkVersion|compileSdk" love-android/app/build.gradle

      - name: Build
        working-directory: love-android
        run: |
          chmod +x gradlew
          ./gradlew assembleEmbedNoRecordDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp love-android/app/build/outputs/apk/embedNoRecord/debug/*.apk out/road-trip.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: road-trip-apk
          path: out/road-trip.apk
