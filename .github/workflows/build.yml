# Builds the Road Trip APK on GitHub's servers. Runs on every push to main, or by hand
# from the Actions tab ("Run workflow"). The APK is attached to the run as "road-trip-apk".
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: [index.html, README.md]   # website and docs changes don't need a new APK
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # to publish the release
    env:
      # love-android commit Road Trip was written against (LÖVE 12, SDL3)
      LOVE_ANDROID_COMMIT: 1c89bb0b2e35ac497e6b8f3f159c73df32cd5cb4

    steps:
      - name: Get Road Trip
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Get love-android
        run: |
          git clone https://github.com/love2d/love-android love-android
          cd love-android
          git checkout "$LOVE_ANDROID_COMMIT"
          git submodule update --init --recursive --depth 1

      - name: Add Road Trip to it
        run: |
          rsync -a --exclude debug.keystore android/ love-android/
          mkdir -p love-android/app/src/embed/assets
          cp -r game/. love-android/app/src/embed/assets/
          # Sign every build with the key in this repo, so a new APK installs over the old
          # one. (Copying it to ~/.android isn't enough: the runner points Gradle elsewhere.)
          cp android/debug.keystore love-android/roadtrip.keystore
          cat >> love-android/app/build.gradle <<'GRADLE'

          // Road Trip: one fixed signing key for every build
          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file("roadtrip.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }

          // Road Trip: unpacking downloaded voices (.tar.bz2)
          dependencies {
              implementation 'org.apache.commons:commons-compress:1.21'
              // Jellyfin: streaming music in the background, and video in Road Trip's screen
              implementation 'androidx.media3:media3-exoplayer:1.4.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
              // the map: MapLibre (vector maps on the GPU, 3D tilt, styles), and the HTTP client it
              // uses, which Road Trip extends to serve bundled fonts and offline areas
              implementation 'org.maplibre.gl:android-sdk:11.13.5'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          GRADLE

      # Natural voices: sherpa-onnx's prebuilt Android libraries (Piper/VITS voices through
      # ONNX Runtime). 1.13.8 is the last release with espeak-ng built in, which Piper needs.
      - name: Add the voice engine
        run: |
          curl -sSfL --retry 4 -o sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2"
          tar xjf sherpa.tar.bz2
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p love-android/app/src/main/jniLibs/$abi
            cp jniLibs/$abi/libsherpa-onnx-jni.so jniLibs/$abi/libonnxruntime.so love-android/app/src/main/jniLibs/$abi/
          done
          ls -la love-android/app/src/main/jniLibs/*

      # ARM only: x86_64 is for emulators, and dropping it keeps the APK much smaller
      - name: Build for ARM devices only
        run: |
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'/abiFilters 'armeabi-v7a', 'arm64-v8a'/" love-android/app/build.gradle
          grep -n "abiFilters" love-android/app/build.gradle

      # Each build gets the next version, so a new APK always counts as an update
      # (and the in-app updater can tell which one is newer).
      - name: Set version from the build number
        run: |
          sed -i "s/^app.version_code=.*/app.version_code=${{ github.run_number }}/; s/^app.version_name=.*/app.version_name=0.1.${{ github.run_number }}/" love-android/gradle.properties
          grep "^app.version" love-android/gradle.properties

      # Gradle downloads the exact SDK platform and NDK love-android asks for by itself,
      # as long as the licenses are accepted.
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          grep -E "ndkVersion|compileSdk" love-android/app/build.gradle

      - name: Build
        working-directory: love-android
        run: |
          chmod +x gradlew
          ./gradlew assembleEmbedNoRecordDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp love-android/app/build/outputs/apk/embedNoRecord/debug/*.apk out/road-trip.apk

      - name: Check it's signed with the Road Trip key
        run: |
          WANT=$(keytool -list -v -keystore android/debug.keystore -storepass android -alias androiddebugkey | grep -m1 "SHA256:" | awk '{print $2}')
          python3 tools/check_signature.py out/road-trip.apk "$WANT"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: road-trip-apk
          path: out/road-trip.apk

      # Every push to main becomes a release, so this link always gets the newest APK:
      # https://github.com/<owner>/<repo>/releases/latest/download/road-trip.apk
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" out/road-trip.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Road Trip 0.1.${{ github.run_number }}" \
            --notes "$(git log -1 --format=%B)"
