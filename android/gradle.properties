# Set the Application name (shown in user launcher) here.
app.name=Road Trip

# Set the application ID here. Application ID must be unique for every app in Android.
# https://developer.android.com/build/configure-app-module#set-application-id
app.application_id=app.roadtrip
# Car screens are landscape; sensorLandscape allows both landscape directions.
app.orientation=sensorLandscape
# Application version code. Incrementing this means "update". If user tires to install an app
# with lower version_code, it will be rejected.
app.version_code=1
# Version text to be shown in the Android app settings.
app.version_name=0.1.0

# No need to modify anything past this line!
android.enableJetifier=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.dependency.useConstraints=true
